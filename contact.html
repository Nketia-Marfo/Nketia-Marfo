<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Nketia-Marfo</title>

<meta
    name="description"
    content="Contact Nketia-Marfo for ideas, conversations, opportunities, collaborations, music, creative services and meaningful projects."
>

<link rel="stylesheet" href="style.css">


<style>

/* =========================================================
   CONTACT PAGE — NKETIA-MARFO
========================================================= */

:root {

    --deep-blue: #0B1F3A;
    --deep-blue-light: #163A63;

    --red: #A61B29;
    --red-light: #C83A48;

    --green: #176B45;
    --green-light: #2E8B68;

    --silver: #B8BEC7;
    --silver-light: #E5E7EB;

    --white: #FFFFFF;
    --off-white: #F7F8FA;

    --dark-text: #17202A;
    --muted-text: #5D6975;

    --soft-green: #EEF3F0;
}


/* =========================================================
   BASE
========================================================= */

.contact-page,
.contact-page p,
.contact-page a,
.contact-page span,
.contact-page button {

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

}


.contact-page h1,
.contact-page h2,
.contact-page h3,
.site-footer h2 {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

}


.contact-page {

    background: var(--off-white);

    color: var(--dark-text);

}


/* =========================================================
   HEADER
========================================================= */

.contact-header {

    border-bottom:
        1px solid
        var(--silver-light);

}


/* =========================================================
   HERO
========================================================= */

.contact-hero {

    max-width: 1250px;

    margin: auto;

    padding:
        95px
        7%
        90px;

    display: grid;

    grid-template-columns:
        1fr
        .8fr;

    gap: 80px;

    align-items: center;

}


.section-label {

    color: var(--green);

    font-size: .76rem;

    font-weight: 800;

    letter-spacing: .2em;

    margin-bottom: 18px;

}


.contact-hero h2 {

    color: var(--deep-blue);

    font-size:
        clamp(3.2rem, 7vw, 6.5rem);

    line-height: .92;

    max-width: 700px;

    margin:
        0 0 30px;

}


.contact-lead {

    max-width: 650px;

    color: var(--muted-text);

    font-size: 1.08rem;

    line-height: 1.85;

    margin-bottom: 14px;

}


.contact-button {

    display: inline-block;

    margin-top: 20px;

    padding:
        15px
        27px;

    background: var(--deep-blue);

    color: var(--white);

    text-decoration: none;

    font-weight: 800;

    transition: .25s ease;

}


.contact-button:hover {

    background: var(--green);

    transform: translateY(-3px);

}


/* =========================================================
   HERO VISUAL
========================================================= */

.contact-visual {

    position: relative;

    min-height: 430px;

    max-width: 470px;

    width: 100%;

    margin-left: auto;

}


.contact-photo {

    position: absolute;

    width: 265px;

    height: 330px;

    right: 55px;

    top: 25px;

    object-fit: cover;

    border-radius: 6px;

    border:
        10px
        solid
        var(--white);

    box-shadow:
        0 25px 60px
        rgba(11,31,58,.18);

    z-index: 3;

}


.visual-blue {

    position: absolute;

    width: 180px;

    height: 180px;

    background: var(--deep-blue);

    border-radius: 50%;

    top: 0;

    right: 0;

}


.visual-green {

    position: absolute;

    width: 145px;

    height: 145px;

    background: var(--green);

    border-radius: 50%;

    bottom: 20px;

    left: 20px;

}


.visual-red {

    position: absolute;

    width: 85px;

    height: 85px;

    background: var(--red);

    border-radius: 50%;

    right: 5px;

    bottom: 0;

    z-index: 4;

}


/* =========================================================
   QUICK CONTACT
========================================================= */

.quick-contact {

    background: var(--deep-blue);

    color: var(--white);

    padding:
        85px
        7%;

}


.quick-contact-inner {

    max-width: 1200px;

    margin: auto;

}


.quick-contact-heading {

    max-width: 720px;

    margin-bottom: 45px;

}


.quick-contact-heading .section-label {

    color: var(--green-light);

}


.quick-contact-heading h2 {

    font-size:
        clamp(2.4rem, 5vw, 4.5rem);

    line-height: 1;

    margin-bottom: 20px;

}


.quick-contact-heading p {

    color: var(--silver-light);

    line-height: 1.8;

}


.contact-methods {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;

}


.contact-method {

    display: block;

    padding: 30px;

    min-height: 180px;

    color: var(--white);

    text-decoration: none;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.14);

    transition: .3s ease;

}


.contact-method:hover {

    transform: translateY(-6px);

    background:
        rgba(255,255,255,.1);

}


.method-icon {

    width: 54px;

    height: 54px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 22px;

    background: var(--green);

    border-radius: 15px;

    font-size: 1.35rem;

    font-weight: 800;

}


.whatsapp-method .method-icon {

    background: #25D366;

}


.email-method .method-icon {

    background: var(--red);

}


.phone-method .method-icon {

    background: var(--deep-blue-light);

    border:
        1px solid
        rgba(255,255,255,.25);

}


.method-label {

    display: block;

    color: var(--silver);

    font-size: .68rem;

    font-weight: 800;

    letter-spacing: .16em;

    text-transform: uppercase;

    margin-bottom: 7px;

}


.contact-method h3 {

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 1.1rem;

    margin-bottom: 8px;

}


.method-detail {

    color: var(--silver-light);

    font-size: .9rem;

    word-break: break-word;

}


/* =========================================================
   SOCIAL MEDIA
========================================================= */

.social-section {

    max-width: 1200px;

    margin: auto;

    padding:
        100px
        7%;

}


.social-intro {

    max-width: 720px;

    margin-bottom: 50px;

}


.social-intro h2 {

    color: var(--deep-blue);

    font-size:
        clamp(2.5rem, 5vw, 4.6rem);

    line-height: 1;

    margin-bottom: 20px;

}


.social-intro p:last-child {

    color: var(--muted-text);

    line-height: 1.8;

}


.social-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;

}


.social-card {

    position: relative;

    display: flex;

    align-items: center;

    gap: 22px;

    min-height: 145px;

    padding: 27px;

    text-decoration: none;

    background: var(--white);

    border:
        1px solid
        var(--silver-light);

    transition: .3s ease;

}


.social-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 20px 45px
        rgba(11,31,58,.12);

}


.social-icon {

    width: 62px;

    height: 62px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: var(--deep-blue);

    color: var(--white);

    border-radius: 17px;

    font-size: 1.65rem;

    font-weight: 800;

}


.social-info {

    padding-right: 25px;

}


.social-platform {

    display: block;

    color: var(--green);

    font-size: .68rem;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .15em;

    margin-bottom: 6px;

}


.social-info h3 {

    color: var(--deep-blue);

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 1.2rem;

    margin-bottom: 5px;

}


.social-info p {

    color: var(--muted-text);

    font-size: .85rem;

    line-height: 1.5;

}


.social-arrow {

    position: absolute;

    top: 22px;

    right: 22px;

    color: var(--red);

}


.tiktok-card:hover .social-icon,
.facebook-card:hover .social-icon {

    background: var(--green);

}


.instagram-card:hover .social-icon,
.x-card:hover .social-icon {

    background: var(--red);

}


/* =========================================================
   VISUAL IDENTITY / LOGOS
========================================================= */

.identity-section {

    background: var(--soft-green);

    padding:
        95px
        7%;

}


.identity-inner {

    max-width: 1200px;

    margin: auto;

}


.identity-heading {

    max-width: 720px;

    margin-bottom: 45px;

}


.identity-heading h2 {

    color: var(--deep-blue);

    font-size:
        clamp(2.5rem, 5vw, 4.5rem);

    line-height: 1;

    margin-bottom: 20px;

}


.identity-heading p {

    color: var(--muted-text);

    line-height: 1.8;

}


.logo-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;

}


.logo-card {

    min-height: 190px;

    padding: 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: var(--white);

    border:
        1px solid
        var(--silver-light);

    transition: .3s ease;

}


.logo-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 18px 40px
        rgba(11,31,58,.1);

}


.logo-card img {

    display: block;

    max-width: 100%;

    max-height: 145px;

    width: auto;

    height: auto;

    object-fit: contain;

}


/* =========================================================
   PERSONAL VISUAL JOURNAL
========================================================= */

.personal-gallery {

    max-width: 1200px;

    margin: auto;

    padding:
        100px
        7%;

}


.gallery-heading {

    max-width: 700px;

    margin-bottom: 45px;

}


.gallery-heading h2 {

    color: var(--deep-blue);

    font-size:
        clamp(2.5rem, 5vw, 4.4rem);

    line-height: 1;

    margin-bottom: 18px;

}


.gallery-heading p {

    color: var(--muted-text);

    line-height: 1.8;

}


.photo-grid {

    display: grid;

    grid-template-columns:
        1.15fr
        .85fr
        .85fr;

    grid-auto-rows: 210px;

    gap: 15px;

}


.photo-card {

    position: relative;

    overflow: hidden;

    background: var(--deep-blue);

}


.photo-card:first-child {

    grid-row:
        span 2;

}


.photo-card img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition: transform .5s ease;

}


.photo-card:hover img {

    transform: scale(1.05);

}


.photo-caption {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    padding:
        30px
        18px
        16px;

    color: var(--white);

    background:
        linear-gradient(
            transparent,
            rgba(11,31,58,.85)
        );

    font-size: .8rem;

    font-weight: 700;

}


/* =========================================================
   SERVICES
========================================================= */

.contact-services {

    background: var(--white);

    padding:
        100px
        8%;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 90px;

    align-items: start;

}


.services-text {

    max-width: 600px;

}


.services-text h2 {

    color: var(--deep-blue);

    font-size:
        clamp(2.5rem, 5vw, 4.5rem);

    line-height: 1;

    margin-bottom: 25px;

}


.services-text p {

    color: var(--muted-text);

    line-height: 1.8;

    margin-bottom: 18px;

}


.services-list {

    border-top:
        1px solid
        var(--silver);

}


.service-item {

    display: flex;

    align-items: center;

    gap: 25px;

    padding: 25px 0;

    border-bottom:
        1px solid
        var(--silver);

}


.service-item span {

    color: var(--red);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 1.1rem;

}


.service-item h3 {

    color: var(--deep-blue);

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 1.05rem;

}


/* =========================================================
   STUDENT VOICES CONNECTION
========================================================= */

.student-voices-cta {

    background: var(--deep-blue);

    color: var(--white);

    padding:
        90px
        7%;

}


.student-voices-inner {

    max-width: 1150px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 45px;

}


.student-voices-inner h2 {

    font-size:
        clamp(2.2rem, 5vw, 4.3rem);

    line-height: 1;

    margin-bottom: 18px;

}


.student-voices-inner p {

    max-width: 650px;

    color: var(--silver-light);

    line-height: 1.8;

}


.student-voices-button {

    flex-shrink: 0;

    padding:
        16px
        26px;

    background: var(--green);

    color: var(--white);

    text-decoration: none;

    font-weight: 800;

    transition: .25s ease;

}


.student-voices-button:hover {

    background: var(--red);

    transform: translateY(-3px);

}


/* =========================================================
   FINAL CTA
========================================================= */

.contact-final {

    max-width: 1200px;

    margin: auto;

    padding:
        100px
        7%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 50px;

}


.contact-final h2 {

    color: var(--deep-blue);

    font-size:
        clamp(2.3rem, 5vw, 4.5rem);

    line-height: 1;

    max-width: 700px;

}


.final-contact-button {

    flex-shrink: 0;

    padding:
        18px
        28px;

    background: var(--red);

    color: var(--white);

    text-decoration: none;

    font-weight: 800;

    transition: .25s ease;

}


.final-contact-button:hover {

    background: var(--green);

    transform: translateY(-3px);

}


/* =========================================================

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nketia-Marfo | Home</title>

<meta name="description"
content="Nketia-Marfo — thinking deeply, creating freely, and sharing ideas about education, economics, music, culture, society and opportunity.">

<!-- Modern, readable fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   NKETIA-MARFO
   REDESIGNED HOME PAGE
   ========================================================= */

:root{
    --navy:#071A35;
    --navy-light:#0D2C52;
    --red:#B51F32;
    --green:#176B45;
    --yellow:#F2C94C;
    --magenta:#A6266E;

    --cream:#FFFDF8;
    --white:#FFFFFF;
    --light:#F5F7FA;
    --text:#18222D;
    --muted:#65717D;
    --border:#E4E8ED;

    --shadow:0 12px 35px rgba(7,26,53,.08);
    --thin-ring:1px solid rgba(7,26,53,.18);
}


/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--cream);
    color:var(--text);

    font-family:"Inter", Arial, sans-serif;
    font-size:16px;
    line-height:1.65;

    overflow-x:hidden;
}

img{
    max-width:100%;
}

a{
    text-decoration:none;
    color:inherit;
}

section{
    width:100%;
}

.container{
    width:min(1180px, 90%);
    margin:auto;
}


/* =========================================================
   HEADER
   ========================================================= */

.site-header{
    background:var(--navy);
    color:white;

    position:sticky;
    top:0;
    z-index:100;

    border-bottom:2px solid var(--yellow);
}

.header-content{
    width:min(1180px, 90%);
    margin:auto;

    min-height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:30px;
}

.brand-block{
    flex-shrink:0;
}

.site-name{
    font-family:"Playfair Display", Georgia, serif;
    font-size:1.65rem;
    font-weight:700;
    letter-spacing:-.02em;
    color:white;
}

.brand-block p{
    margin:2px 0 0;
    color:#C9D4E0;
    font-size:.72rem;
    letter-spacing:.04em;
}

.main-nav{
    display:flex;
    align-items:center;
    gap:4px;
}

.nav-link{
    color:#E7EDF4;

    padding:9px 13px;

    border-radius:5px;

    font-size:.82rem;
    font-weight:600;

    transition:.2s ease;
}

.nav-link:hover{
    background:var(--red);
    color:white;
}

.nav-link.active{
    background:var(--yellow);
    color:var(--navy);
}


/* =========================================================
   GENERAL TYPOGRAPHY
   ========================================================= */

.eyebrow{
    margin:0 0 12px;

    color:var(--red);

    font-size:.68rem;
    font-weight:800;
    letter-spacing:.16em;
    text-transform:uppercase;
}

.dark-eyebrow{
    color:var(--yellow);
}

h1,
h2,
h3{
    font-family:"Playfair Display", Georgia, serif;
}

h1,
h2,
h3,
p{
    margin-top:0;
}

.section-title{
    color:var(--navy);

    font-size:clamp(2rem,4vw,3.6rem);
    line-height:1.08;

    letter-spacing:-.025em;

    margin-bottom:18px;
}

.body-text{
    color:var(--muted);
    max-width:680px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:44px;
    padding:11px 19px;

    border-radius:5px;

    background:var(--red);
    color:white;

    font-size:.86rem;
    font-weight:700;

    transition:.2s ease;
}

.button:hover{
    background:var(--green);
    transform:translateY(-2px);
}

.text-link{
    display:inline-block;

    color:var(--navy);

    font-size:.86rem;
    font-weight:800;

    border-bottom:2px solid var(--yellow);

    padding-bottom:2px;
}

.text-link:hover{
    color:var(--red);
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
    padding:78px 0 70px;

    background:
        radial-gradient(circle at 90% 15%,
        rgba(166,38,110,.10),
        transparent 25%),

        radial-gradient(circle at 5% 85%,
        rgba(23,107,69,.08),
        transparent 25%);
}

.hero-grid{
    display:grid;

    grid-template-columns:1.05fr .95fr;

    gap:65px;

    align-items:center;
}

.hero h1{
    color:var(--navy);

    font-size:clamp(2.9rem,5.4vw,5.3rem);

    line-height:.98;

    letter-spacing:-.055em;

    margin-bottom:25px;
}

.hero-lead{
    max-width:620px;

    color:#35424E;

    font-size:1.05rem;
    line-height:1.75;

    margin-bottom:14px;
}

.hero-description{
    max-width:590px;

    color:var(--muted);

    font-size:.94rem;
    line-height:1.75;

    margin-bottom:28px;
}

.hero-actions{
    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:20px;
}


/* =========================================================
   HERO IMAGES
   ONLY CIRCULAR / SQUARE FRAMES
   ========================================================= */

.hero-images{
    position:relative;

    min-height:430px;
}

.hero-image{
    position:absolute;

    overflow:hidden;

    background:white;

    box-shadow:var(--shadow);

    border:1px solid white;
    outline:var(--thin-ring);
}

.hero-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* Main circle */

.hero-image.main{
    width:330px;
    height:330px;

    right:15px;
    top:0;

    border-radius:50%;

    outline-color:var(--yellow);
}


/* Bottom-left square */

.hero-image.second{
    width:205px;
    height:205px;

    left:20px;
    bottom:5px;

    border-radius:12px;

    outline-color:var(--green);
}


/* Bottom-right circle */

.hero-image.third{
    width:150px;
    height:150px;

    right:0;
    bottom:0;

    border-radius:50%;

    outline-color:var(--magenta);
}


/* =========================================================
   INTRO STATEMENT
   ========================================================= */

.statement{
    background:var(--navy);
    color:white;

    padding:65px 0;
}

.statement-grid{
    display:grid;

    grid-template-columns:90px 1fr;

    gap:35px;

    align-items:start;
}

.statement-number{
    color:var(--yellow);

    font-family:"Playfair Display", Georgia, serif;

    font-size:3rem;
}

.statement h2{
    max-width:760px;

    color:white;

    font-size:clamp(2rem,4vw,3.6rem);

    line-height:1.08;

    margin-bottom:18px;
}

.statement p{
    max-width:680px;

    color:#CBD6E1;

    font-size:.96rem;
}


/* =========================================================
   STANDARD CONTENT SECTION
   ========================================================= */

.content-section{
    padding:85px 0;
}

.content-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:65px;

    align-items:center;
}


/* =========================================================
   CONTENT IMAGE
   ========================================================= */

.content-photo{
    width:100%;

    display:flex;
    justify-content:center;
}

.content-photo img{
    width:100%;
    max-width:510px;

    height:430px;

    object-fit:cover;

    display:block;

    background:white;

    border:4px solid white;

    outline:1px solid rgba(7,26,53,.18);

    box-shadow:var(--shadow);

    border-radius:14px;
}

.content-photo.circle img{
    width:390px;
    height:390px;

    border-radius:50%;

    outline-color:var(--green);
}


/* =========================================================
   SMALL FEATURE
   ========================================================= */

.feature{
    padding:0 0 85px;
}

.feature-box{
    display:grid;

    grid-template-columns:280px 1fr;

    gap:35px;

    align-items:center;

    background:white;

    padding:25px;

    border-left:4px solid var(--green);

    box-shadow:var(--shadow);
}

.feature-image{
    width:100%;
    height:230px;

    object-fit:cover;

    border:3px solid white;
    outline:1px solid rgba(7,26,53,.18);

    border-radius:10px;
}

.feature h3{
    color:var(--navy);

    font-size:1.8rem;

    line-height:1.15;

    margin-bottom:12px;
}

.feature p{
    color:var(--muted);

    font-size:.92rem;

    margin-bottom:0;
}


/* =========================================================
   WHAT I WRITE ABOUT
   ========================================================= */

.topics{
    padding:85px 0;

    background:var(--light);
}

.topics-header{
    max-width:700px;

    margin-bottom:45px;
}

.topics-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:22px;
}


/* Topic card */

.topic-card{
    background:white;

    padding:25px 22px 27px;

    border-top:4px solid var(--navy);

    box-shadow:0 8px 25px rgba(7,26,53,.06);

    text-align:left;

    transition:.25s ease;
}

.topic-card:nth-child(2){
    border-top-color:var(--green);
}

.topic-card:nth-child(3){
    border-top-color:var(--magenta);
}

.topic-card:nth-child(4){
    border-top-color:var(--red);
}

.topic-card:hover{
    transform:translateY(-5px);

    box-shadow:0 15px 35px rgba(7,26,53,.10);
}

.topic-number{
    color:var(--yellow);

    font-size:.68rem;
    font-weight:800;

    letter-spacing:.12em;
}

.topic-card h3{
    color:var(--navy);

    font-size:1.4rem;

    margin:16px 0 10px;
}

.topic-card p{
    color:var(--muted);

    font-size:.84rem;

    line-height:1.65;

    margin-bottom:22px;
}


/* =========================================================
   ROUND PHOTO UNDER EACH WRITING TOPIC
   ========================================================= */

.topic-photo{
    display:flex;
    justify-content:flex-start;

    margin-top:15px;
}

.topic-photo img{
    width:105px;
    height:105px;

    object-fit:cover;

    display:block;

    border-radius:50%;

    border:3px solid white;

    outline:1px solid rgba(7,26,53,.20);

    box-shadow:0 7px 20px rgba(7,26,53,.10);
}

.topic-card:nth-child(1) .topic-photo img{
    outline-color:var(--navy);
}

.topic-card:nth-child(2) .topic-photo img{
    outline-color:var(--green);
}

.topic-card:nth-child(3) .topic-photo img{
    outline-color:var(--magenta);
}

.topic-card:nth-child(4) .topic-photo img{
    outline-color:var(--red);
}


/* =========================================================
   ECONOMICS FEATURE
   ========================================================= */

.opportunity{
    background:var(--navy);

    color:white;

    padding:85px 0;
}

.opportunity-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:60px;

    align-items:center;
}

.opportunity h2{
    color:white;

    font-size:clamp(2.2rem,4vw,4rem);

    line-height:1.06;

    margin-bottom:20px;
}

.opportunity p{
    color:#D0DBE5;

    max-width:620px;

    font-size:.94rem;

    line-height:1.8;
}

.opportunity-photo img{
    width:100%;
    height:400px;

    object-fit:cover;

    border:4px solid white;

    outline:1px solid var(--green);

    border-radius:14px;

    box-shadow:var(--shadow);
}


/* =========================================================
   MUSIC
   ========================================================= */

.music{
    padding:85px 0;
}

.music-grid{
    display:grid;

    grid-template-columns:.9fr 1.1fr;

    gap:65px;

    align-items:center;
}

.music-images{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}

.music-images img{
    width:100%;
    height:245px;

    object-fit:cover;

    border:3px solid white;

    outline:1px solid rgba(7,26,53,.18);

    box-shadow:var(--shadow);
}

.music-images img:first-child{
    border-radius:50%;
}

.music-images img:nth-child(2){
    border-radius:12px;
}

.music-images img:nth-child(3){
    grid-column:1 / -1;

    height:280px;

    border-radius:12px;
}


/* =========================================================
   FEATURED THOUGHT
   ========================================================= */

.featured{
    padding:80px 0;

    background:#FAFAF8;
}

.featured-box{
    max-width:850px;
}

.featured-box h2{
    color:var(--navy);

    font-size:clamp(2.2rem,4vw,3.8rem);

    line-height:1.07;

    margin-bottom:18px;
}

.featured-box p{
    color:var(--muted);

    max-width:720px;

    font-size:.96rem;
}


/* =========================================================
   PHOTO JOURNEY
   ========================================================= */

.gallery{
    padding:85px 0;

    background:white;
}

.gallery-heading{
    max-width:700px;

    margin-bottom:45px;
}

.gallery-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:16px;
}

.gallery-item{
    height:260px;

    overflow:hidden;

    background:white;

    border:3px solid white;

    outline:1px solid rgba(7,26,53,.15);

    box-shadow:0 8px 25px rgba(7,26,53,.07);

    position:relative;
}

.gallery-item img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:.35s ease;
}

.gallery-item:hover img{
    transform:scale(1.04);
}


/* Only round and square frames */

.gallery-item.round{
    border-radius:50%;
}

.gallery-item.square{
    border-radius:12px;
}

.gallery-caption{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:35px 14px 13px;

    background:linear-gradient(
        to top,
        rgba(7,26,53,.82),
        transparent
    );

    color:white;

    font-size:.72rem;
    font-weight:700;
}


/* =========================================================
   COMMUNITY
   ========================================================= */

.community{
    padding:85px 0;
}

.community-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:65px;

    align-items:center;
}


/* =========================================================
   FINAL CTA
   ========================================================= */

.final{
    background:linear-gradient(
        120deg,
        var(--red),
        var(--magenta)
    );

    color:white;

    padding:70px 0;
}

.final-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:50px;

    align-items:center;
}

.final h2{
    color:white;

    font-size:clamp(2.4rem,4vw,4.3rem);

    line-height:1;

    margin-bottom:0;
}

.final p{
    color:#FFECEF;

    max-width:530px;

    font-size:.94rem;
}

.final .button{
    background:var(--yellow);

    color:var(--navy);
}

.final .button:hover{
    background:white;
}


/* =========================================================
   FOOTER
   ========================================================= */

footer{
    background:#0B0B0C;

    color:white;
}

.footer-content{
    width:min(1180px,90%);

    margin:auto;

    padding:60px 0;

    display:grid;
